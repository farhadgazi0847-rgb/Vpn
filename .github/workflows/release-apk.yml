name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap web build with Capacitor Android
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.meridian.vpn",
            "appName": "Meridian VPN",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../meridian-vpn-preview.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meridian VPN v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build of the Meridian VPN interactive web application (WebView wrapper).
            Note: This preview APK runs the Meridian VPN interface and architectural simulator on Android; real OS-level IP routing requires adding native `VpnService` + WireGuard backend nodes.
          files: meridian-vpn-preview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
